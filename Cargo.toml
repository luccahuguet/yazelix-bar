[package]
name = "nova_bar"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Standalone Nova top bar for Zellij"
license = "Apache-2.0"
repository = "https://github.com/Yazelix/nova-bar"
readme = "README.md"
keywords = ["zellij", "zjstatus", "terminal", "tui", "yazelix"]
categories = ["command-line-utilities"]

[[bin]]
name = "nova_bar_widget"
path = "src/bin/nova_bar_widget.rs"

[dependencies]
rusqlite = { version = "0.39.0", features = ["bundled"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }

[features]
default = ["providers"]
providers = ["dep:rusqlite"]
